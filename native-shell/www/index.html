<!doctype html>
<html lang="sq">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#0c0c0e" />
    <title>RUTINA</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(
            ellipse 58% 42% at 50% 44%,
            rgba(220, 38, 38, 0.32),
            rgba(220, 38, 38, 0.06) 42%,
            transparent 68%
          ),
          #0c0c0e;
        color: #fafafa;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      main {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 900;
        letter-spacing: 0.01em;
        line-height: 1;
        text-transform: uppercase;
      }
      h1 span {
        color: #f80213;
      }
      .tick {
        display: block;
        width: 2.1rem;
        height: 3px;
        margin: 0.9rem auto 0;
        border-radius: 99px;
        background: #f80213;
        box-shadow: 0 0 14px rgba(248, 2, 19, 0.85);
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1><span>R</span>UTINA</h1>
        <span class="tick"></span>
      </div>
    </main>
  </body>
</html>
